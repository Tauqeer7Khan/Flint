services:
  postgres:
    image: postgres:17-alpine
    container_name: flint-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: flint
      POSTGRES_USER: flint
      POSTGRES_PASSWORD: flint
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flint -d flint"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
